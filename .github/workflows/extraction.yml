name: Extraction hebdomadaire DHIS2
run-name: Extraction DHIS2 · ${{ github.event.inputs.request_id || 'planifiée' }}

# Lundi 00:00 Africa/Dakar (= 00:00 UTC, Dakar n'a pas d'heure d'ete) + rattrapage
# mardi si la semaine du lundi manque + declenchement manuel.
on:
  schedule:
    # Lundi dès 00:00 UTC (= 00:00 Dakar). GitHub retarde ou abandonne souvent les tâches planifiées à minuit (heure de pointe) : le lundi, une tentative
    # toutes les 15 minutes jusqu'à 05:45. La première exécutée extrait ; les suivantes voient que la semaine est
    # déjà présente (job check-week) et s'arrêtent en quelques secondes. Jamais de double extraction.
    - cron: "*/15 0-5 * * 1"   # lundi 00:00, 00:15, 00:30 … 05:45
    - cron: "0 6 * * 2"   # mardi 06:00 UTC, dernier rattrapage conditionnel
  workflow_dispatch:
    inputs:
      mois:
        description: "Paramètre historique conservé pour compatibilité ; l'extraction est cumulative depuis janvier"
        required: false
        type: string
      request_id:
        description: "Identifiant de suivi de la demande depuis le tableau de bord"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: extraction-dhis2
  cancel-in-progress: false

jobs:
  check-week:
    runs-on: ubuntu-latest
    outputs:
      necessaire: ${{ steps.verif.outputs.necessaire }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: verif
        run: |
          # Déclenchement manuel : toujours. Planifié (minuit ou relance) : seulement si la semaine manque.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "necessaire=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python -m completude.cli check-week; then
            echo "Semaine deja presente dans l'historique : extraction planifiee inutile."
            echo "necessaire=false" >> "$GITHUB_OUTPUT"
          else
            echo "Semaine absente de l'historique : extraction necessaire."
            echo "necessaire=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PYTHONPATH: src

  extraire:
    needs: check-week
    if: needs.check-week.outputs.necessaire == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Lancer l'extraction
        env:
          PYTHONPATH: src
          DHIS2_USER: ${{ secrets.DHIS2_USER }}
          DHIS2_PASSWORD: ${{ secrets.DHIS2_PASSWORD }}
          MOIS_INPUT: ${{ inputs.mois }}
        run: |
          if [ -n "$MOIS_INPUT" ]; then
            python -m completude.cli extract --mois "$MOIS_INPUT"
          else
            python -m completude.cli extract
          fi

      - name: Regenerer les JSON du dashboard
        env:
          PYTHONPATH: src
        run: python -m completude.cli build-json

      - name: Committer les donnees mises a jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Rien a committer (aucune donnee modifiee)."
          else
            git commit -m "chore(data): extraction automatique du $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Redeployer le dashboard (un push du bot ne declenche pas Pages)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref master
