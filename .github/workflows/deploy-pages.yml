name: Deployer le dashboard sur GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "data/latest.json"
      - "data/evolution.json"
      - "data/snapshots.json"
      - "data/geo/districts.geojson"
      - "data/geo/regions.geojson"
      - "data/export.json"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site (web/ + donnees legeres)
        run: |
          mkdir -p site/data/geo
          cp -r web/. site/
          cp data/latest.json site/data/latest.json
          cp data/evolution.json site/data/evolution.json
          cp data/snapshots.json site/data/snapshots.json
          cp data/geo/districts.geojson site/data/geo/districts.geojson
          cp data/geo/regions.geojson site/data/geo/regions.geojson
          cp data/export.json site/data/export.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # L'API d'artefacts met parfois quelques secondes à lister l'artefact qui vient d'être envoyé.
      - name: Attendre la disponibilité de l'artefact
        run: |
          for essai in 1 2 3 4 5 6; do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[]|select(.name=="github-pages")]|length' 2>/dev/null || echo 0)
            [ "$n" -ge 1 ] && exit 0
            sleep 10
          done
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # Le service de déploiement voit parfois l'artefact avec retard : on attend puis on réessaie une fois.
      - name: Nouvelle tentative de déploiement après attente
        if: steps.deployment.outcome == 'failure'
        run: sleep 45

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
