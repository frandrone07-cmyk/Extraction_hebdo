name: Deployer le dashboard sur GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "data/latest.json"
      - "data/evolution.json"
      - "data/snapshots.json"
      - "data/geo/districts.geojson"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assembler le site (web/ + donnees legeres)
        run: |
          mkdir -p site/data/geo
          cp -r web/. site/
          cp data/latest.json site/data/latest.json
          cp data/evolution.json site/data/evolution.json
          cp data/snapshots.json site/data/snapshots.json
          cp data/geo/districts.geojson site/data/geo/districts.geojson

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
